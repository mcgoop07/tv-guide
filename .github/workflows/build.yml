name: Build TV guide
on:
  schedule:
    - cron: '30 4 * * *'   # every day at 04:30 UTC
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Offline translators (CPU-only torch keeps the install small). Models are cached between runs.
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet argostranslate transformers sentencepiece sacremoses
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: translate-models-${{ github.run_id }}
          restore-keys: translate-models-
      # English translations from earlier runs (tcache/translations.json in the repo is the starting copy),
      # so only new programmes are translated each day.
      - uses: actions/cache@v4
        with:
          path: tcache
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - run: mkdir -p public && python3 build.py "$RUNNER_TEMP/cache"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
